#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
sort_by = "alphabetical"
sort_sensitive = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5

[open]
prepend_rules = [
  # Preserve the old Ranger behavior: edit web source instead of opening it.
  { url = "*.{html,htm,xhtml}", use = "edit" },
]
